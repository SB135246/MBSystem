name: MBSystem CI/CD

on:
  push:
    branches: [ "feature/backend" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mbsystem .
          docker push ${{ secrets.DOCKER_USERNAME }}/mbsystem

      - name: Deploy to AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # 1. 새 이미지 가져오기
            docker pull ${{ secrets.DOCKER_USERNAME }}/mbsystem
            
            # 2. 기존 mbs-app이 있다면 중지 및 삭제
            docker stop mbs-app || true
            docker rm mbs-app || true
            
            # 3. 새 컨테이너 실행 (환경 변수 주입이 핵심!)
            docker run -d -p 8080:8080 --name mbs-app \
              -e RDS_URL="${{ secrets.RDS_URL }}" \
              -e RDS_USERNAME="${{ secrets.RDS_USERNAME }}" \
              -e RDS_PASSWORD="${{ secrets.RDS_PASSWORD }}" \
              ${{ secrets.DOCKER_USERNAME }}/mbsystem