name: Deploy React to GCP

on:
  push:
    branches:
      - "feature/frontend"  # 특정 브랜치를 확실히 지정하는 것이 안전합니다.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Deploy to GCE
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          source: "dist/*"
          target: "/var/www/html"
          strip_components: 1  # 이 줄이 반드시 있어야 dist 폴더 내부 파일만 깔끔하게 복사됩니다.