name: Deploy React to GCP

on:
  push:
    branches:
      - feature/frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        # 이제 루트에 package.json이 있으므로 working-directory를 지우거나 아래처럼 바꿉니다.
        run: |
          npm install
          npm run build

      - name: Deploy to GCE
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          # 빌드 결과물(dist)이 루트 폴더 바로 아래에 생깁니다.
          source: "dist/*"
          target: "/var/www/html"
          # dist 폴더 안의 파일만 보내야 하므로 1로 변경합니다.
          strip_components: 1