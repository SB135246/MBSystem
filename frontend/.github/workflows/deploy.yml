name: Deploy React to GCP

on:
  push:
    branches:
      - feature/frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        working-directory: frontend   # 🔥 이거 추가
        run: |
          
          npm install
          npm run build

      - name: Deploy to GCE
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          # 빌드 결과물은 frontend/dist 안에 생성됨
          source: "frontend/dist/*"
          target: "/var/www/html"
          # frontend/dist 두 단계를 제외하고 파일만 전송
          strip_components: 2